<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MediaPipe Face Landmarker Webcam Demo</title>
  <style>
    video, canvas { position: absolute; left: 0; top: 0; }
  </style>
</head>
<body>
  <div style="position: relative;">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output_canvas"></canvas>
  </div>
  <img id="testImg" src="./ok.jpg" style="display: none;">

  <script type="module">
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest";

    const camera = document.getElementById("webcam");
    const canvas = document.getElementById("output_canvas");
    const snapshot = document.createElement("canvas");
    const test = document.getElementById("testImg");
    snapshot.width = camera.videoWidth;
    snapshot.height = camera.videoHeight;
    const contextSnapshot = snapshot.getContext("2d")!;

    const ctx = canvas.getContext("2d");

    let lastVideoTime = -1;

    async function run() {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
      );
      let faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`,
          delegate: "GPU"
        },
        runningMode: "IMAGE",
        numFaces: 1,
        outputFacialTransformationMatrixes: true,
      });

      try {
        const results = faceLandmarker.detect(test);
        console.log(results.faceLandmarks)
      } catch (error) {
        console.log(error)
        // fallback to CPU
        faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`,
            delegate: "CPU"
          },
          runningMode: "IMAGE",
          numFaces: 1,
          outputFacialTransformationMatrixes: true,
        });
      }

      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      camera.srcObject = stream;
      camera.addEventListener("loadeddata", () => {
        canvas.width = camera.videoWidth;
        canvas.height = camera.videoHeight;
        predictWebcam(faceLandmarker);
      });
    }

    async function predictWebcam(faceLandmarker) {
      if (camera.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        contextSnapshot?.drawImage(camera, 0, 0);
        const results = faceLandmarker.detect(camera);
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (results.faceLandmarks) {
          for (const landmarks of results.faceLandmarks) {
            for (const point of landmarks) {
              const x = point.x * canvas.width;
              const y = point.y * canvas.height;
              ctx.fillStyle = "#00FF00";
              ctx.fillRect(x, y, 2, 2);
            }
          }
        }
      }
      requestAnimationFrame(() => predictWebcam(faceLandmarker));
    }

    run();
  </script>
</body>
</html>
