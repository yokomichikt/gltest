<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MediaPipe Face Landmarker Webcam Demo</title>
  <style>
    video, canvas { position: absolute; left: 0; top: 0; }
  </style>
  <script type="module">
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest";

    let camera
    let canvas
    let snapshot
    let test
    let contextSnapshot
    let ctx
    let lastVideoTime = -1;

    window.addEventListener("load", () => {
      camera = document.getElementById("webcam");
      canvas = document.getElementById("output_canvas");
      snapshot = document.createElement("canvas");
      test = document.getElementById("testImg");
      contextSnapshot = snapshot.getContext("2d");
      ctx = canvas.getContext("2d");
      run();
    });

    async function run() {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
      );
      let faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`,
          delegate: "GPU"
        },
        runningMode: "IMAGE",
        numFaces: 1,
        outputFacialTransformationMatrixes: true,
      });

      let useCPU = false
      try {
        console.log(test.naturalWidth, test.naturalHeight)
        const results = faceLandmarker.detect(test);
        console.log(results.faceLandmarks)
        if (results.faceLandmarks.length === 0) {
          useCPU = true
        }
      } catch (error) {
        console.log(error)
        // fallback to CPU
        useCPU = true
      }

      if (useCPU) {
        console.log("detect by GPU is failed. Fallbacked to CPU")
        faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`,
            delegate: "CPU"
          },
          runningMode: "IMAGE",
          numFaces: 1,
          outputFacialTransformationMatrixes: true,
        });
      }

      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      camera.srcObject = stream;
      camera.addEventListener("loadeddata", () => {
        canvas.width = camera.videoWidth;
        canvas.height = camera.videoHeight;
        snapshot.width = camera.videoWidth;
        snapshot.height = camera.videoHeight;
        predictWebcam(faceLandmarker);
      });
    }

    async function predictWebcam(faceLandmarker) {
      if (camera.currentTime !== lastVideoTime) {
        lastVideoTime = camera.currentTime;
        contextSnapshot?.drawImage(camera, 0, 0);
        const results = faceLandmarker.detect(camera);
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (results.faceLandmarks) {
          for (const landmarks of results.faceLandmarks) {
            for (const point of landmarks) {
              const x = point.x * canvas.width;
              const y = point.y * canvas.height;
              ctx.fillStyle = "#00FF00";
              ctx.fillRect(x, y, 2, 2);
            }
          }
        }
      }
      requestAnimationFrame(() => predictWebcam(faceLandmarker));
    }
  </script>
</head>
<body>
  <div style="position: relative;">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output_canvas"></canvas>
  </div>
  <img id="testImg" src="./ok.jpg" style="display: none;">
</body>
</html>
