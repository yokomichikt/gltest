<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MediaPipe Face Landmarker Webcam Demo</title>
  <style>
    video, canvas { position: absolute; left: 0; top: 0; }
  </style>
</head>
<body>
  <div style="position: relative;">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <script type="module">
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest";

    const video = document.getElementById("webcam");
    const canvas = document.getElementById("output_canvas");
    const ctx = canvas.getContext("2d");

    async function run() {
      const vision = await FilesetResolver.forVisionTasks(
          "https://yokomichikt.github.io/gltest"
      );
      const faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`,
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numFaces: 1
      });

      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      console.log(stream)
      video.srcObject = stream;
      video.addEventListener("loadeddata", () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        predictWebcam(faceLandmarker);
      });
    }

    let lastVideoTime = -1;
    async function predictWebcam(faceLandmarker) {
      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const results = faceLandmarker.detectForVideo(video, performance.now());
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (results.faceLandmarks) {
          for (const landmarks of results.faceLandmarks) {
            for (const point of landmarks) {
              const x = point.x * canvas.width;
              const y = point.y * canvas.height;
              ctx.fillStyle = "#00FF00";
              ctx.fillRect(x, y, 2, 2);
            }
          }
        }
      }
      requestAnimationFrame(() => predictWebcam(faceLandmarker));
    }

    run();
  </script>
</body>
</html>
